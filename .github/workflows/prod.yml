name: TC15 - Local Missing profile_id

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: windows-latest
    steps:
      - name: Install Playwright
        run: npm install -g playwright@1.52.0

      - name: Trigger SedStart test run
        uses: sedstart/runlocal@v1
        with:
          api_key: ${{ secrets.API_KEY_A }}
          project_id: 418
          test_id: 1974
          browser: chrome
          headless: false
          environment: QA
