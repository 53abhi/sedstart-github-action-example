name: Sedstart Prod

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SedStart test run
        uses: sedstart/runcloud@v1
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY }}
          project_id: 398
          test_id: 2120
          profile_id: 801
          browser: "webkit"
          headless: false
          environment: QA
