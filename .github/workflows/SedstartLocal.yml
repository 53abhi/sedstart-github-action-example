name: Sedstart1 QA

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SedStart test run
        uses: sedstart/runcloud@main
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_QA }}
          project_id: 514
          test_id: 3669
          profile_id: 1089
          browser: 'msedge'
          headless: false
          environment: "QA"
