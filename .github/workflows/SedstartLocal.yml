name: Sedstart1 QA

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SedStart test run
        uses: sedstart/runcloud@main
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_QA }}
          project_id: 1272
          test_id: 11622
          profile_id: 2232
          browser: 'chrome'
          headless: false
