name: Sedstart QA 1

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SedStart test run
        uses: sedstart/runcloud@v1
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_QA }}
          project_id: 503
          test_id: 000
          profile_id: 1007
          browser: chrome
          headless: false
          environment: QA
