name: Sedstart Local macOS

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: macos-15
    steps:
      - name: Install Playwright
        run: npm install -g playwright@1.52.0

      - name: Trigger SedStart test run
        uses: sedstart/runlocal@main
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_QA }}
          project_id: 750
          test_id: 8527
          profile_id: 1358
          browser: 'webkit'
          headless: false
