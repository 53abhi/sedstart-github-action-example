name: Sedstart local

on:
  workflow_dispatch:

jobs:
  sedstart:
    runs-on: windows-latest
    steps:
      - name: Running Sedstart
        uses: sedstart/runlocal@main
        with:
          api_key: ${{ secrets.SEDSTART_KEY }}
          project_id: 418
          suite_id: 391
          profile_id: 848
          browser: 'msedge'
          headless: false
          environment: QA
